name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: CMake, CTest and headless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          mkdir -p cmake-build-ci/.cmake/api/v1/query
          touch cmake-build-ci/.cmake/api/v1/query/codemodel-v2
          cmake -S . -B cmake-build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cmake-build-ci --config Release --parallel 2
      - name: CTest
        run: ctest --test-dir cmake-build-ci --build-config Release --output-on-failure
      - name: Explicit headless self-test
        run: ./cmake-build-ci/Headless/gv2-headless --self-test
      - name: Explicit headless check-scripts
        run: ./cmake-build-ci/Headless/gv2-headless --check-scripts
      - name: Explicit gv2-content smoke test
        run: |
          ./cmake-build-ci/Tools/Content/gv2-content validate GameData/core
          ./cmake-build-ci/Tools/Content/gv2-content hash GameData/core
          ./cmake-build-ci/Tools/Content/gv2-content coverage GameData/core
          ./cmake-build-ci/Tools/Content/gv2-content describe GameData/core item
          ./cmake-build-ci/Tools/Content/gv2-content validate Tests/Fixtures/PortableContentCore/valid/core
          ./cmake-build-ci/Tools/Content/gv2-content hash Tests/Fixtures/PortableContentCore/valid/core
          ./cmake-build-ci/Tools/Content/gv2-content inspect Tests/Fixtures/PortableContentCore/valid/core core:item.weapon.iron_sword --provenance

  documentation:
    name: Documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate links, front matter and dependency graph
        run: python3 Tools/Documentation/validate_docs.py

  unreal-acceptance:
    name: Unreal GV2 Acceptance
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    env:
      UE_ROOT: ${{ vars.UE_ROOT || '/opt/unreal-engine' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal installation
        run: |
          test -x "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"
          test -x "$UE_ROOT/Engine/Binaries/Linux/UnrealEditor-Cmd"
      - name: Run UBT compiler-negative probe
        run: |
          python3 Tools/Testing/validate_presentation_apply_module_graph.py --ubt-probe --ue-root "$UE_ROOT"
      - name: Build GV2Editor
        run: >-
          "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"
          GV2Editor Linux Development "$GITHUB_WORKSPACE/GV2.uproject"
          -WaitMutex -NoHotReloadFromIDE
      - name: Run GV2 acceptance automation
        run: |
          python3 Tools/Testing/run_ue_acceptance.py \
            --filter GV2 \
            --fresh-process \
            --ue-root "$UE_ROOT" \
            --project "$GITHUB_WORKSPACE/GV2.uproject" \
            --log-path "$RUNNER_TEMP/GV2Automation.log" \
            --report-dir "$RUNNER_TEMP/GV2AutomationReport"
      - name: Upload Unreal automation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gv2-acceptance-automation-artifacts
          path: |
            ${{ runner.temp }}/GV2Automation.log
            ${{ runner.temp }}/GV2AutomationReport
          if-no-files-found: warn
          retention-days: 14
